<!DOCTYPE html>
<!-- Families App campaign board v1 (29 Oct 2026): every campaign as a card with visual, status pipeline, health, requirements, assets, actions with owner and due date, channels, KPI, PR, notes. Cards view (side by side) and Pipeline view (columns per status, drag to move). Data in Supabase qcz table marketing_campaign_board, images in storage bucket marketing/<city>/campaigns. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign board</title>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#F8F6FA;--ink:#2f2a38;--mute:#8a7f97;--soft:#a79dbb;--line:#e9e2ef;--card:#fff;--lilac:#B597C1;--pink:#E8B0C8;--red:#d9534f;--amber:#e39b2d;--green:#3a9a6e;}
  body{background:var(--bg);color:var(--ink);font-family:'Karla',-apple-system,sans-serif;padding:24px 20px 80px;}
  .hidden{display:none !important;}
  .wrap{max-width:1240px;margin:0 auto;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--lilac);outline-offset:2px;border-radius:6px;}
  .btn{background:linear-gradient(135deg,var(--lilac),var(--pink));color:#fff;font-weight:800;padding:10px 16px;border:none;border-radius:12px;font-size:14px;cursor:pointer;white-space:nowrap;}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn.small{padding:6px 11px;font-size:12.5px;border-radius:10px;}
  .out{border:none;background:none;color:var(--soft);font-size:13px;cursor:pointer;text-decoration:underline;}
  .msg{color:var(--mute);font-size:14px;}

  /* login */
  .login{max-width:380px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center;}
  .login input{width:100%;border:1.5px solid #e0d8ea;border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;margin:14px 0 10px;}
  .login .btn{width:100%;}

  /* header */
  header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:18px;}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;}
  .mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--lilac),var(--pink));color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(181,151,193,.35);}
  h1{font-size:24px;font-weight:800;}
  .pills{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;}
  .pills button{padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;color:#6f6680;border:none;background:none;cursor:pointer;}
  .pills button.on{background:var(--ink);color:#fff;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -20px 18px;padding:0 20px;overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs a{font-size:14.5px;font-weight:800;color:var(--mute);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-1px;text-decoration:none;white-space:nowrap;}
  .tabs a:hover{color:var(--ink);}
  .tabs a.on{color:var(--ink);border-bottom-color:var(--lilac);}
  .ptitle{font-size:22px;font-weight:800;margin:4px 0 14px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .ptitle em{font-style:normal;font-weight:400;}
  .ptitle small{font-size:13px;font-weight:600;color:var(--soft);}
  .ptitle .jump{margin-left:auto;font-size:13px;color:var(--mute);font-weight:700;}
  /* playbook */
  .pb{margin-top:34px;padding-top:6px;}
  .pbgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
  .pbc{border-radius:22px;padding:18px 18px 16px;color:#fff;position:relative;cursor:pointer;box-shadow:0 6px 18px rgba(47,42,56,.08);min-height:160px;}
  .pbc h3{font-size:12.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;opacity:.95;margin-bottom:8px;}
  .pbc ul{list-style:none;display:flex;flex-direction:column;gap:6px;}
  .pbc li{font-size:14px;line-height:1.45;padding-left:14px;position:relative;}
  .pbc li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.75);}
  .pbc .ed{position:absolute;top:14px;right:16px;font-size:12px;font-weight:700;opacity:0;transition:opacity .15s;}
  .pbc:hover .ed{opacity:.85;}
  .pbc.editing{cursor:default;background:#fff !important;color:var(--ink);border:2px solid var(--lilac);}
  .pbc.editing input,.pbc.editing textarea{width:100%;border:1.5px solid #e6dfee;border-radius:10px;padding:8px 10px;font-family:inherit;font-size:14px;margin-bottom:8px;}
  .pbc.editing textarea{min-height:150px;line-height:1.45;}
  .pbc .row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .links{display:flex;gap:12px;align-items:center;}

  /* summary */
  .summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;}
  .stat .l{font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);}
  .stat .v{font-size:24px;font-weight:800;margin-top:2px;}
  .stat .s{font-size:12.5px;color:var(--soft);}
  .stat.warn .v{color:var(--red);}
  .pipe{display:flex;height:8px;border-radius:6px;overflow:hidden;background:#f1ecf5;margin-top:8px;}
  .pipe span{display:block;height:100%;}

  /* toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;position:sticky;top:0;z-index:20;background:rgba(248,246,250,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 0;}
  .seg{display:flex;gap:3px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;}
  .seg button{padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px;color:#6f6680;border:none;background:none;cursor:pointer;white-space:nowrap;}
  .seg button.on{background:var(--ink);color:#fff;}
  #filter{max-width:100%;overflow-x:auto;scrollbar-width:none;}
  #filter::-webkit-scrollbar{display:none;}
  .search{flex:1;min-width:160px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-family:inherit;font-size:14px;background:#fff;}
  .toolbar .btn{margin-left:auto;}

  /* cards view */
  .row{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 18px;scroll-snap-type:x proximity;align-items:flex-start;}
  .row::-webkit-scrollbar{height:10px;} .row::-webkit-scrollbar-thumb{background:#ddd3e6;border-radius:6px;}
  .card{flex:0 0 320px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 2px 10px rgba(47,42,56,.04);display:flex;flex-direction:column;}
  .vis{position:relative;height:210px;background:linear-gradient(160deg,#fde3ec,#f3e9fb);padding:12px 12px 0;}
  .vis .frame{height:100%;border-radius:16px 16px 0 0;overflow:hidden;background:#fff;position:relative;}
  .vis img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block;}
  .ph{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-align:center;padding:16px;}
  .ph b{font-size:38px;font-weight:800;opacity:.9;letter-spacing:-1px;}
  .ph small{font-size:12px;font-weight:700;opacity:.85;}
  .badges{position:absolute;top:20px;left:20px;right:20px;display:flex;gap:6px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.92);color:var(--ink);}
  .chip.launch{background:var(--ink);color:#fff;}
  .chip.red{background:#fde6e5;color:#b23b37;} .chip.amber{background:#fdf0dc;color:#9a5d0a;} .chip.green{background:#e3f4ec;color:#22744f;}
  .band{padding:13px 16px;color:#fff;}
  .band h3{font-size:17px;font-weight:800;line-height:1.2;}
  .band p{font-size:13px;opacity:.92;margin-top:2px;}
  .body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:11px;flex:1;}
  .sel{width:100%;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-family:inherit;font-size:13.5px;font-weight:700;background:#fff;}
  .steps{display:flex;gap:3px;margin-top:6px;}
  .steps i{flex:1;height:5px;border-radius:3px;background:#efe9f4;}
  .steps i.on{background:var(--lilac);}
  .kv{display:grid;grid-template-columns:86px 1fr;gap:4px 8px;font-size:13px;}
  .kv b{color:var(--mute);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding-top:1px;}
  .desc{font-size:13.5px;line-height:1.45;color:#4a4256;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .sec{border-top:1px solid #f1ecf5;padding-top:9px;}
  .sec h4{font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;margin-bottom:5px;}
  .sec h4 span{color:var(--soft);font-weight:700;}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35;padding:2px 0;cursor:pointer;}
  .chk input{margin-top:2px;accent-color:var(--lilac);flex-shrink:0;}
  .chk.done span{color:var(--soft);text-decoration:line-through;}
  .chk .meta{margin-left:auto;font-size:11.5px;color:var(--soft);white-space:nowrap;padding-left:6px;}
  .chk .meta.late{color:var(--red);font-weight:800;}
  .more{font-size:12px;color:var(--soft);}
  .prog{height:6px;border-radius:4px;background:#f1ecf5;overflow:hidden;}
  .prog span{display:block;height:100%;background:linear-gradient(90deg,var(--lilac),var(--pink));}
  .chs{display:flex;flex-wrap:wrap;gap:4px;}
  .chs span{font-size:11.5px;font-weight:700;background:#f4eff8;color:#6f6680;border-radius:8px;padding:2px 7px;}
  .next{background:#faf7fc;border-radius:12px;padding:8px 10px;font-size:13px;}
  .next b{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--mute);display:block;}
  .blocked{background:#fde6e5;color:#8f2f2b;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;}
  .foot{display:flex;gap:6px;margin-top:auto;padding-top:4px;}
  .foot .btn{flex:1;}
  .suggest{background:#e3f4ec;color:#22744f;border-radius:12px;padding:8px 10px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .suggest button{margin-left:auto;}
  .group-t{font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);margin:8px 0 8px;display:flex;gap:10px;align-items:baseline;}
  .group-t small{font-weight:600;text-transform:none;letter-spacing:0;color:var(--soft);}

  /* pipeline view */
  .kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:18px;align-items:flex-start;}
  .col{flex:0 0 230px;background:#f1ecf5;border-radius:18px;padding:10px;min-height:120px;}
  .col.over{background:#e9def2;outline:2px dashed var(--lilac);}
  .col h5{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#6f6680;display:flex;gap:6px;align-items:center;margin:2px 4px 8px;}
  .col h5 i{width:9px;height:9px;border-radius:50%;}
  .col h5 span{margin-left:auto;color:var(--soft);}
  .mini{background:#fff;border-radius:14px;padding:9px 10px;margin-bottom:8px;cursor:grab;border-left:5px solid #ccc;box-shadow:0 1px 4px rgba(47,42,56,.05);}
  .mini b{font-size:13.5px;display:block;}
  .mini small{font-size:11.5px;color:var(--soft);display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .mini .prog{margin-top:6px;}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(47,42,56,.35);z-index:50;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#fff;z-index:51;overflow-y:auto;box-shadow:-10px 0 30px rgba(47,42,56,.12);}
  .drawer .dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:center;z-index:2;}
  .drawer .dh h3{font-size:17px;font-weight:800;margin-right:auto;}
  .drawer .db{padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px;}
  .f label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mute);margin-bottom:4px;}
  .f input[type=text],.f input[type=date],.f input[type=url],.f textarea,.f select{width:100%;border:1.5px solid #e6dfee;border-radius:10px;padding:9px 11px;font-family:inherit;font-size:14px;background:#fff;}
  .f textarea{min-height:90px;resize:vertical;line-height:1.45;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .list .it{display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:center;margin-bottom:5px;}
  .list .it.act{grid-template-columns:20px 1fr 90px 132px auto;}
  .list .it input[type=text],.list .it input[type=date],.list .it select{border:1px solid #ece5f2;border-radius:8px;padding:6px 8px;font-family:inherit;font-size:13px;width:100%;min-width:0;}
  .list .it input[type=checkbox]{accent-color:var(--lilac);}
  .x{border:none;background:none;color:var(--soft);font-size:18px;cursor:pointer;line-height:1;padding:0 4px;}
  .add{border:1px dashed #d9cfe4;background:none;border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:700;color:#6f6680;cursor:pointer;}
  .imgrow{display:flex;gap:10px;align-items:center;}
  .imgrow img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line);}
  .toggle{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700;}
  .saved{font-size:12.5px;color:var(--green);font-weight:700;}
  .danger{color:var(--red);}

  @media (max-width:900px){.summary{grid-template-columns:repeat(2,minmax(0,1fr));}.summary .stat:last-child{grid-column:1 / -1;}.pbgrid{grid-template-columns:1fr 1fr;}}
  @media (max-width:560px){
    body{padding:16px 16px 60px;}
    .card{flex-basis:86vw;}
    .pbgrid{grid-template-columns:1fr;}
    .tabs{margin:0 -16px 14px;padding:0 16px;}
    .two{grid-template-columns:1fr;}
    .list .it.act{grid-template-columns:20px 1fr auto;}
    .list .it.act .ow,.list .it.act .du{grid-column:2 / 3;}
    .toolbar .btn{margin-left:0;}
  }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <h1 style="margin:0">Campaign board</h1>
  <p class="msg" style="margin-top:8px">Log in with your email code.</p>
  <div id="l-step1">
    <input type="email" id="l-email" placeholder="email address">
    <button class="btn" id="l-send">Send code</button>
  </div>
  <div id="l-step2" class="hidden">
    <input type="text" id="l-code" inputmode="numeric" maxlength="10" autocomplete="one-time-code" placeholder="code from the email">
    <button class="btn" id="l-verify">Log in</button>
  </div>
  <p class="msg" id="l-msg" style="margin-top:10px"></p>
</div>

<div id="app" class="wrap hidden">
  <header>
    <div class="brand"><span class="mark" aria-hidden="true">F</span><h1>Families App marketing</h1></div>
    <div class="pills" id="cities"></div>
    <div class="links"><button class="out" id="logout">log out</button></div>
  </header>
  <nav class="tabs">
    <a href="index.html#dashboard">Dashboard</a><a href="index.html#concepts">Concepts</a><a href="index.html#accounts">Accounts</a><a href="index.html#formats">Formats</a><a href="campaigns.html" class="on" aria-current="page">Campaigns</a><a href="index.html#library">Library</a><a href="home-cms.html">Home CMS</a>
  </nav>
  <h2 class="ptitle">Plans of <em>Campaigns</em> <small>status, requirements and actions of every campaign</small><a class="jump" href="#playbook">Playbook &darr;</a></h2>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <div class="seg" id="view"><button data-v="cards" class="on">Cards</button><button data-v="pipeline">Pipeline</button></div>
    <div class="seg" id="filter">
      <button data-f="all" class="on">All</button><button data-f="launch">At launch</button><button data-f="ad">Ads</button><button data-f="organic">Organic</button><button data-f="attention">Needs attention</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search campaigns, actions, owners">
    <button class="btn" id="new">+ New campaign</button>
  </div>

  <div id="board"></div>
  <p class="msg" id="err"></p>

  <section id="playbook" class="pb">
    <h2 class="ptitle">Playbook <small>the rules every campaign follows. Click a block to edit it</small><button class="btn ghost small" id="pb-add" style="margin-left:auto">+ add block</button></h2>
    <div class="pbgrid" id="pbgrid"></div>
  </section>
</div>

<div id="scrim" class="scrim hidden"></div>
<aside id="drawer" class="drawer hidden" aria-label="Edit campaign"></aside>

<script>
const SUPABASE_URL = 'https://qczutthumgpgxwepatte.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFjenV0dGh1bWdwZ3h3ZXBhdHRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzg5NzAsImV4cCI6MjA4NDY1NDk3MH0.vleNYVReRJnMruKBTXEb9gwdKVdhbiuLJTZoDiuUM0g';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const TABLE = 'marketing_campaign_board';
const CITIES = { ibiza: 'Ibiza', amsterdam: 'Amsterdam', valencia: 'Valencia' };
let city = (() => { try { return localStorage.getItem('fm-city') || 'amsterdam'; } catch (e) { return 'amsterdam'; } })();
if (!CITIES[city]) city = 'amsterdam';

/* Status pipeline. "path" statuses are the normal flow; paused and done sit outside it. */
const STATUS = [
  { k: 'idea',       t: 'Idea',          c: '#c9bfd6', path: 0 },
  { k: 'brief',      t: 'Brief',         c: '#a98bc4', path: 1 },
  { k: 'production', t: 'In production', c: '#e39b2d', path: 2 },
  { k: 'review',     t: 'In review',     c: '#e8739a', path: 3 },
  { k: 'approved',   t: 'Approved',      c: '#4f9fd1', path: 4 },
  { k: 'scheduled',  t: 'Scheduled',     c: '#6a7fd6', path: 5 },
  { k: 'live',       t: 'Live',          c: '#3a9a6e', path: 6 },
  { k: 'paused',     t: 'Paused',        c: '#9a93a6', path: -1 },
  { k: 'done',       t: 'Done',          c: '#2f2a38', path: -1 },
];
const S = Object.fromEntries(STATUS.map(s => [s.k, s]));
const GATED = ['approved', 'scheduled', 'live']; // need all requirements done
const OWNERS = ['Ciao', 'Claude', 'Partner', 'Freelancer'];

let rows = [], view = 'cards', filter = 'all', q = '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dayDiff = iso => Math.round((new Date(iso + 'T00:00:00') - today()) / 864e5);
function isoWeek(iso) { const d = new Date(iso + 'T00:00:00Z'); const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); const n = (t.getUTCDay() + 6) % 7; t.setUTCDate(t.getUTCDate() - n + 3); const f = new Date(Date.UTC(t.getUTCFullYear(), 0, 4)); return 1 + Math.round(((t - f) / 864e5 - 3 + ((f.getUTCDay() + 6) % 7)) / 7); }
const fmtDate = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '';

/* ---------- logic ---------- */
function counts(r) {
  const all = [...(r.requirements || []), ...(r.assets || []), ...(r.actions || [])];
  const req = r.requirements || [];
  return { done: all.filter(x => x.done).length, total: all.length, reqOpen: req.filter(x => !x.done).length, reqTotal: req.length };
}
function pct(r) { const c = counts(r); return c.total ? Math.round(100 * c.done / c.total) : 0; }
function nextAction(r) {
  const open = (r.actions || []).filter(a => !a.done && a.text);
  open.sort((a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : 1);
  return open[0] || null;
}
function lateActions(r) { return (r.actions || []).filter(a => !a.done && a.due && dayDiff(a.due) < 0).length; }
/* health: blocked > overdue > at risk > on track; finished states show nothing */
function health(r) {
  if (r.status === 'done') return { k: 'done', t: 'Done', cls: 'green' };
  if (r.blocked_reason) return { k: 'blocked', t: 'Blocked', cls: 'red' };
  if (r.status === 'paused') return { k: 'paused', t: 'Paused', cls: '' };
  if (r.deadline && r.status !== 'live') {
    const d = dayDiff(r.deadline);
    if (d < 0) return { k: 'overdue', t: `Overdue ${-d}d`, cls: 'red' };
    if (d <= 7 && pct(r) < 70) return { k: 'risk', t: 'At risk', cls: 'amber' };
  }
  if (lateActions(r)) return { k: 'risk', t: `${lateActions(r)} late action${lateActions(r) > 1 ? 's' : ''}`, cls: 'amber' };
  if (r.status === 'live') return { k: 'live', t: 'Live', cls: 'green' };

}

function suggestion(r) {

  if (r.blocked_reason) return null;
  if (st === 'production' && c.total && c.done === c.total) return { to: 'review', t: 'Everything ticked. Send to review?' };
  if (st === 'review' && c.reqTotal && c.reqOpen === 0) return { to: 'approved', t: 'Requirements met. Approve?' };
  if (st === 'brief' && c.reqTotal && c.reqOpen === 0) return { to: 'production', t: 'Brief complete. Start production?' };
  return null;
}

  dr.image_url = sb.storage.from('marketing').getPublicUrl(path).data.publicUrl;
  $('d-saved').textContent = 'Image ready, press Save'; drawDrawer();
}
async function saveDrawer() {
  if (!dr.title) { alert('Give the campaign a title.'); return; }
  ['requirements', 'assets', 'actions'].forEach(k => dr[k] = (dr[k] || []).filter(x => x.text && x.text.trim()));
  const orig = rows.find(x => x.key === dr.key);
  if (orig && dr.status !== orig.status && GATED.includes(dr.status) && counts(dr).reqOpen > 0 && !confirm(`${counts(dr).reqOpen} requirement(s) are still open. Save as ${S[dr.status].t} anyway?`)) return;
  const fields = ['title', 'tagline', 'code', 'kind', 'wave', 'at_launch', 'status', 'blocked_reason', 'landing_page', 'app_target', 'gift', 'involve', 'description', 'channels', 'requirements', 'assets', 'actions', 'kpi', 'deadline', 'owner', 'pr', 'notes', 'image_url', 'color', 'sort'];
  const row = Object.fromEntries(fields.map(f => [f, dr[f] ?? null]));
  row.channels = row.channels || []; row.at_launch = !!row.at_launch; row.sort = row.sort || 0;
  let res;
  if (dr._new) {
    row.key = dr.key; row.city = city;
    res = await sb.from(TABLE).insert(row).select().single();
  } else {
    res = await sb.from(TABLE).update(row).eq('key', dr.key).select().single();
  }
  if (res.error) { alert('Save failed: ' + res.error.message); return; }
  const i = rows.findIndex(x => x.key === res.data.key);
  if (i >= 0) rows[i] = res.data; else rows.push(res.data);
  rows.sort((a, b) => a.sort - b.sort);
  dr = JSON.parse(JSON.stringify(res.data)); drawDrawer(); $('d-saved').textContent = 'Saved'; render();
}
$('new').onclick = () => {
  const key = 'c' + Date.now().toString(36);
  openDrawer({ _new: true, key, city, title: '', kind: filter === 'organic' ? 'organic' : 'ad', status: 'idea', at_launch: false, channels: [], requirements: [], assets: [], actions: [], owner: 'Ciao', color: '#B597C1', sort: (rows.at(-1)?.sort || 0) + 1 });
};

/* ---------- toolbar ---------- */
$('view').querySelectorAll('button').forEach(b => b.onclick = () => { view = b.dataset.v; $('view').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); try { localStorage.setItem('cb-view', view); } catch (e) {} render(); });
$('filter').querySelectorAll('button').forEach(b => b.onclick = () => { filter = b.dataset.f; $('filter').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); render(); });
$('q').oninput = e => { q = e.target.value; render(); };
try { const v = localStorage.getItem('cb-view'); if (v) { view = v; $('view').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === v)); } } catch (e) {}

/* ---------- cities ---------- */
function renderCities() {
  $('cities').innerHTML = Object.entries(CITIES).map(([k, v]) => `<button data-c="${k}" class="${k === city ? 'on' : ''}">${v}</button>`).join('');
  $('cities').querySelectorAll('button').forEach(b => b.onclick = () => { city = b.dataset.c; try { localStorage.setItem('fm-city', city); } catch (e) {} renderCities(); load(); loadPlaybook(); });
}

/* ---------- playbook (knowledge base) ---------- */
const PB_TABLE = 'marketing_playbook';
const PB_DEFAULT = [
  { id: 'sell', sort: 1, color: '#F2679A', title: 'What we sell', body: 'A curated, bilingual, ad-free super app for family life. Nobody paid to be recommended, no agency commissions.\nMembers pay for independence, and independence is a feeling, not a feature.\nAmsterdam Insider: EUR 0,99 a week, price on screen, cancel anytime.\nFounding Family badge for everyone who joins in the first 90 days.' },
  { id: 'funnel', sort: 2, color: '#8E5FA8', title: 'The funnel', body: 'Every ad asks a question about the family, never about the app.\nIt links to a short quiz or landing page on amsterdamfamilies.com.\nPeople leave their email: that is the only key. No codes, no links to click later.\nThey see half the result on the web; the full result waits in the app.\nThen the hooks keep them: Dailies, Favorites, Playdates, Babysitters.' },
  { id: 'channels', sort: 3, color: '#4F9FD1', title: 'Channels', body: 'Attention on Meta: one ad set per campaign, four creatives, review every 7 days, kill losers, scale winners 20 to 30 percent.\nIntent on Apple Ads and Google: kinderfeestje Amsterdam, kindvriendelijk restaurant Amsterdam, babysitter Amsterdam, wat te doen met kinderen Amsterdam.\nTrust on Instagram organic: the 8 formats.\nEvery campaign gets its own store listing and deep link, so installs are counted per campaign.' },
  { id: 'bar', sort: 4, color: '#3A9A6E', title: 'The bar to beat', body: '60% quiz completion.\n5% of quiz completers become Insider (10% is the dream).\n45% first renewal.\nMembers from search 3x cheaper than from Meta.\nRead the numbers against this every Monday on the Dashboard.' },
  { id: 'creative', sort: 5, color: '#F39A2B', title: 'Creative rules', body: 'Phone-shot beats polished.\nThe hook is a question.\nOne moment per ad.\nPrice on screen, honestly.\nResult cards are ads: 1080x1920 in our palette, members post them, we repost.\nTest, kill, scale.' },
  { id: 'habits', sort: 6, color: '#F47F6B', title: 'Always-on habits', body: 'First hour after every post: reply to each comment with a question back, answer DMs, comment on 5 local accounts, pin the best comment.\nComment to DM: reels end with "Comment PLAN and we send you the link", then DM the link by hand.\nCollab posts: every post that features a place or a person goes out with Invite Collaborator.\nBoost the winner on Sunday: if one post clearly beat the week, put 15 to 20 euro behind it for 3 days, parents 30 to 45 in the city. Never boost a flop.' },
];
let pb = [], pbEdit = null;
async function loadPlaybook() {
  const { data, error } = await sb.from(PB_TABLE).select('*').eq('city', city).order('sort');
  if (error) { pb = PB_DEFAULT.map(x => ({ ...x, _local: true })); renderPlaybook(); return; }
  pb = data || [];
  if (!pb.length && city === 'amsterdam') {
    const rowsIn = PB_DEFAULT.map(x => ({ ...x, city }));
    const ins = await sb.from(PB_TABLE).insert(rowsIn).select();
    pb = (!ins.error && ins.data && ins.data.length) ? ins.data.sort((a, b) => a.sort - b.sort) : PB_DEFAULT.map(x => ({ ...x, _local: true }));
  }
  renderPlaybook();
}
function renderPlaybook() {
  if (!pb.length) { $('pbgrid').innerHTML = '<p class="msg">No playbook blocks for this city yet. Add one.</p>'; return; }
  $('pbgrid').innerHTML = pb.map(b => pbEdit === b.id
    ? `<div class="pbc editing" data-id="${esc(b.id)}"><input type="text" data-k="title" value="${esc(b.title)}"><textarea data-k="body" placeholder="One point per line">${esc(b.body || '')}</textarea>
        <div class="row2"><input type="text" data-k="color" value="${esc(b.color || '')}" placeholder="#B597C1" style="width:110px;margin:0"><button class="btn small" data-a="save">Save</button><button class="btn ghost small" data-a="cancel">Cancel</button><button class="out danger" data-a="del" style="margin-left:auto">delete</button></div></div>`
    : `<div class="pbc" data-id="${esc(b.id)}" style="background:linear-gradient(150deg,${b.color || '#B597C1'},${b.color || '#B597C1'}cc)" tabindex="0" role="button" aria-label="Edit ${esc(b.title)}"><span class="ed">edit</span><h3>${esc(b.title)}</h3><ul>${String(b.body || '').split('\n').filter(x => x.trim()).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
  $('pbgrid').querySelectorAll('.pbc:not(.editing)').forEach(el => { el.onclick = () => { pbEdit = el.dataset.id; renderPlaybook(); }; el.onkeydown = e => { if (e.key === 'Enter') el.click(); }; });
  const ed = $('pbgrid').querySelector('.pbc.editing'); if (!ed) return;
  const b = pb.find(x => x.id === pbEdit);
  ed.querySelector('[data-a=cancel]').onclick = () => { if (b._new) pb = pb.filter(x => x !== b); pbEdit = null; renderPlaybook(); };
  ed.querySelector('[data-a=save]').onclick = async () => {
    const row = { title: ed.querySelector('[data-k=title]').value.trim() || 'Untitled', body: ed.querySelector('[data-k=body]').value, color: ed.querySelector('[data-k=color]').value.trim() || '#B597C1' };
    const res = b._new ? await sb.from(PB_TABLE).insert({ ...row, id: b.id, city, sort: b.sort }).select().single() : await sb.from(PB_TABLE).update(row).eq('id', b.id).select().single();
    if (res.error) { alert('Save failed: ' + res.error.message); return; }
    Object.assign(b, res.data); delete b._new; pbEdit = null; renderPlaybook();
  };
  ed.querySelector('[data-a=del]').onclick = async () => {
    if (!confirm(`Delete the block "${b.title}"?`)) return;
    if (!b._new) { const { error } = await sb.from(PB_TABLE).delete().eq('id', b.id); if (error) { alert('Delete failed: ' + error.message); return; } }
    pb = pb.filter(x => x !== b); pbEdit = null; renderPlaybook();
  };
  ed.querySelector('[data-k=title]').focus();
}
$('pb-add').onclick = () => { const id = 'pb' + Date.now().toString(36); pb.push({ id, _new: true, title: '', body: '', color: '#B597C1', sort: (pb.at(-1)?.sort || 0) + 1 }); pbEdit = id; renderPlaybook(); };

boot();
</script>
